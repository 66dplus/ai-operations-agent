[project]
name = "ai-operations-agent"
version = "0.1.0"
description = "Evidence-backed company research with OpenCode and human review"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1", "psycopg[binary]==3.3.6", "pydantic==2.13.5", "mcp==2.3.0"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["operations"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
